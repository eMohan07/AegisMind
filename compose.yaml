name: aegismind

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aegismind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegismind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegismind_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegismind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegismind} -d ${POSTGRES_DB:-aegismind}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aegismind-net

  spicedb:
    image: authzed/spicedb:v1.38.0
    container_name: aegismind-spicedb
    restart: unless-stopped
    command: serve --grpc-preshared-key "${SPICEDB_TOKEN:-aegismind-spicedb-preshared-key}" --http-addr :8443 --grpc-addr :50051 --datastore-engine memory
    ports:
      - "${SPICEDB_GRPC_PORT:-50051}:50051"
      - "${SPICEDB_HTTP_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "spicedb", "datastore", "test"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - aegismind-net

  tei-embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: aegismind-tei-embedder
    restart: unless-stopped
    command: --model-id BAAI/bge-m3 --port 80
    environment:
      HF_ENDPOINT: "https://huggingface.co"
    ports:
      - "${TEI_EMBEDDER_PORT:-8081}:80"
    volumes:
      - tei_cache:/data
    networks:
      - aegismind-net

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: aegismind-tei-reranker
    restart: unless-stopped
    command: --model-id BAAI/bge-reranker-v2-m3 --port 80
    environment:
      HF_ENDPOINT: "https://huggingface.co"
    ports:
      - "${TEI_RERANKER_PORT:-8082}:80"
    volumes:
      - tei_cache:/data
    networks:
      - aegismind-net

  docling:
    image: ghcr.io/ds4sd/docling-serve:latest
    container_name: aegismind-docling
    profiles:
      - ocr
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    networks:
      - aegismind-net

  agora:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agora
    image: aegismind/agora:latest
    pull_policy: build
    container_name: aegismind-agora
    restart: unless-stopped
    environment:
      AEGISMIND_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegismind}:${POSTGRES_PASSWORD:-aegismind_secure_password}@postgres:5432/${POSTGRES_DB:-aegismind}
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_TOKEN:-aegismind-spicedb-preshared-key}
      TEI_EMBEDDER_URL: http://tei-embedder:80
      TEI_RERANKER_URL: http://tei-reranker:80
      DOCLING_URL: http://docling:5001
      AEGISMIND_MASTER_KEY: ${AEGISMIND_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGORA_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_started
      tei-embedder:
        condition: service_started
      tei-reranker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/connectors\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aegismind-net

  scribe:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scribe
    image: aegismind/scribe:latest
    pull_policy: build
    container_name: aegismind-scribe
    restart: unless-stopped
    environment:
      AEGISMIND_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegismind}:${POSTGRES_PASSWORD:-aegismind_secure_password}@postgres:5432/${POSTGRES_DB:-aegismind}
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_TOKEN:-aegismind-spicedb-preshared-key}
      TEI_EMBEDDER_URL: http://tei-embedder:80
      DOCLING_URL: http://docling:5001
      AEGISMIND_MASTER_KEY: ${AEGISMIND_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_started
    networks:
      - aegismind-net

  lens:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.lens
    image: aegismind/lens:latest
    pull_policy: build
    container_name: aegismind-lens
    restart: unless-stopped
    ports:
      - "${LENS_PORT:-3000}:80"
    depends_on:
      agora:
        condition: service_started
    networks:
      - aegismind-net

  n8n:
    image: n8nio/n8n:latest
    container_name: aegismind-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # n8n core
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-aegismind_n8n_password}
      # Persistence
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-aegismind_n8n_encryption_key_32ch}
      # AegisMind connection details (pre-set as env vars for use in workflow expressions)
      AEGISMIND_BASE_URL: http://agora:8000
      AEGISMIND_API_KEY: ${AEGISMIND_API_KEY:-}
      # Slack integration
      SLACK_CHANNEL_ALERTS: ${SLACK_CHANNEL_ALERTS:-#aegismind-alerts}
      SLACK_CHANNEL_DIGEST: ${SLACK_CHANNEL_DIGEST:-#aegismind-digest}
      # Execution settings
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336          # 14 days in hours
      N8N_METRICS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro  # auto-import on first start
    depends_on:
      agora:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aegismind-net

networks:
  aegismind-net:
    driver: bridge

volumes:
  postgres_data:
  tei_cache:
  n8n_data:
