[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-connector-gmail"
version = "0.0.1"
description = "Gmail mailboxes, messages, threads, and labels"
requires-python = ">=3.12"
dependencies = [
    "aegismind-types",
    "aegismind-connector-sdk",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.entry-points."aegismind.connectors"]
gmail = "aegismind_connector_gmail:get_connector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
aegismind-connector-sdk = { workspace = true }
