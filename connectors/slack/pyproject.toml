[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-connector-slack"
version = "0.0.1"
description = "Slack public and private channels, messages, and threads"
requires-python = ">=3.12"
dependencies = [
    "aegismind-types",
    "aegismind-connector-sdk",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.entry-points."aegismind.connectors"]
slack = "aegismind_connector_slack:get_connector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
aegismind-connector-sdk = { workspace = true }
