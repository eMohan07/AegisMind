[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-connector-teams"
version = "0.0.1"
description = "Microsoft Teams, channels, and chat messages"
requires-python = ">=3.12"
dependencies = [
    "aegismind-types",
    "aegismind-connector-sdk",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.entry-points."aegismind.connectors"]
teams = "aegismind_connector_teams:get_connector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
aegismind-connector-sdk = { workspace = true }
