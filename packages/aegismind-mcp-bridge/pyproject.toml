[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-mcp-bridge"
version = "0.0.1"
description = "Model Context Protocol bridge for AegisMind knowledge retrieval"
requires-python = ">=3.12"
dependencies = [
    "aegismind-types",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
