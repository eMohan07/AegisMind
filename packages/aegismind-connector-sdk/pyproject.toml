[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-connector-sdk"
version = "0.0.1"
description = "Connector SDK, declarative manifest compiler, and verification harness for AegisMind"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aegismind-types",
    "jsonschema>=4.20",
    "jsonpath-ng>=1.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
