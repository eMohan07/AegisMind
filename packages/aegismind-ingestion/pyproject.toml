[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-ingestion"
version = "0.0.1"
description = "Contextual chunking, document parsing, and durable sync workflows for AegisMind"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aegismind-types",
    "aegismind-authz",
    "aegismind-retrieval",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.entry-points."aegismind.parser"]
text = "aegismind_ingestion.adapters_parser:TextParserAdapter"
markdown = "aegismind_ingestion.adapters_parser:MarkdownParserAdapter"
docling = "aegismind_ingestion.adapters_parser:DoclingParserAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aegismind-types = { workspace = true }
aegismind-authz = { workspace = true }
aegismind-retrieval = { workspace = true }
