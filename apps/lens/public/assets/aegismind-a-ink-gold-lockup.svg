<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 15 410 135" width="410" height="135" role="img">
  <title>AegisMind, Sovereign Second Brain</title>
  <!-- Shield Emblem on Left -->
  <g transform="translate(-1.5, 5) scale(0.75)">
    <!-- Outer Shield -->
    <path d="M100 12 L166 32 V92 C166 132 138 164 100 188 C62 164 34 132 34 92 V32 Z" fill="#141E33" stroke="#F2D48A" stroke-width="3" stroke-opacity="0.9"/>
    <!-- Inner Inset Shield -->
    <path d="M100 24 L155 41 V92 C155 126 131 153 100 172 C69 153 45 126 45 92 V41 Z" fill="none" stroke="#F2D48A" stroke-opacity="0.45" stroke-width="1.8"/>
    <!-- Constellation Lines -->
    <g stroke="#F2D48A" stroke-linecap="round" fill="none">
      <line x1="100" y1="66" x2="74" y2="134" stroke-width="6"/>
      <line x1="100" y1="66" x2="126" y2="134" stroke-width="6"/>
      <line x1="81.6" y1="114" x2="118.4" y2="114" stroke-width="5"/>
    </g>
    <!-- Constellation Nodes -->
    <g fill="#F2D48A">
      <circle cx="100" cy="66" r="9"/>
      <circle cx="74" cy="134" r="8"/>
      <circle cx="126" cy="134" r="8"/>
    </g>
  </g>

  <!-- Responsive Adaptive Styles for Dark and Light Modes -->
  <style>
    .brand-title { fill: #FFFFFF; }
    .brand-sub { fill: #94A3B8; }
    @media (prefers-color-scheme: light) {
      .brand-title { fill: #10203A; }
      .brand-sub { fill: #475569; }
    }
  </style>

  <!-- Wordmark Expanded Towards Right with High Legibility -->
  <text x="142" y="82" font-family="Inter, 'Segoe UI', -apple-system, sans-serif" font-size="58" font-weight="700" class="brand-title" letter-spacing="-1">
    Aegis<tspan font-weight="300" fill="#E5B94E">Mind</tspan>
  </text>
  <text x="145" y="116" font-family="Inter, 'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="600" class="brand-sub" letter-spacing="3.8">
    SOVEREIGN SECOND BRAIN
  </text>
</svg>
