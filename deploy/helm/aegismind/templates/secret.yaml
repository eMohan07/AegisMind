apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegismind.fullname" . }}-secrets
  labels:
    {{- include "aegismind.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  SPICEDB_TOKEN: {{ .Values.secrets.spicedbToken | quote }}
  AEGISMIND_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
