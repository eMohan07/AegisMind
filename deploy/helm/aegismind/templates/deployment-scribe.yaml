apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegismind.fullname" . }}-scribe
  labels:
    {{- include "aegismind.labels" . | nindent 4 }}
    app.kubernetes.io/component: scribe
spec:
  replicas: {{ .Values.replicaCount.scribe }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aegismind.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scribe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aegismind.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scribe
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: scribe
          image: "{{ .Values.images.scribe.repository }}:{{ .Values.images.scribe.tag }}"
          imagePullPolicy: {{ .Values.images.scribe.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "aegismind.fullname" . }}-config
            - secretRef:
                name: {{ include "aegismind.fullname" . }}-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          resources:
            {{- toYaml .Values.resources.scribe | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
