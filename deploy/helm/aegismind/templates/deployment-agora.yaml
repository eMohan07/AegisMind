apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegismind.fullname" . }}-agora
  labels:
    {{- include "aegismind.labels" . | nindent 4 }}
    app.kubernetes.io/component: agora
spec:
  replicas: {{ .Values.replicaCount.agora }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aegismind.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aegismind.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agora
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: agora
          image: "{{ .Values.images.agora.repository }}:{{ .Values.images.agora.tag }}"
          imagePullPolicy: {{ .Values.images.agora.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aegismind.fullname" . }}-config
            - secretRef:
                name: {{ include "aegismind.fullname" . }}-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          resources:
            {{- toYaml .Values.resources.agora | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/connectors
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/connectors
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
