apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegismind.fullname" . }}-config
  labels:
    {{- include "aegismind.labels" . | nindent 4 }}
data:
  AEGISMIND_ENV: {{ .Values.config.env | quote }}
  TENANT_DEFAULT: {{ .Values.config.tenantDefault | quote }}
  SPICEDB_ENDPOINT: {{ .Values.config.spicedbEndpoint | quote }}
  TEI_EMBEDDER_URL: {{ .Values.config.teiEmbedderUrl | quote }}
  TEI_RERANKER_URL: {{ .Values.config.teiRerankerUrl | quote }}
  DOCLING_URL: {{ .Values.config.doclingUrl | quote }}
