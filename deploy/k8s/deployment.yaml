apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegismind-agora
  namespace: aegismind
  labels:
    app.kubernetes.io/name: aegismind
    app.kubernetes.io/component: agora
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aegismind
      app.kubernetes.io/component: agora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegismind
        app.kubernetes.io/component: agora
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agora
          image: aegismind/agora:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aegismind-config
            - secretRef:
                name: aegismind-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
